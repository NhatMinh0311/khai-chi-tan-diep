      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GrantSubscriptionRequest' }
      responses:
        '204': { description: Đã cập nhật }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/users:
    get:
      tags: [Admin]
      operationId: adminListUsers
