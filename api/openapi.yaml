        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/clans/{clanId}/subscription:
    parameters:
      - $ref: '#/components/parameters/ClanId'
    put:
      tags: [Admin]
      operationId: adminGrantSubscription
