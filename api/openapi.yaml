        - { name: q, in: query, description: Tìm theo tên dòng họ hoặc email OWNER, schema: { type: string, maxLength: 100 } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AdminClan' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/clans/{clanId}/status:
    parameters:
      - $ref: '#/components/parameters/ClanId'
    put:
      tags: [Admin]
      operationId: adminSetClanStatus
