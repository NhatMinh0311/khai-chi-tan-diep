      parameters:
        - { name: q, in: query, description: Tìm theo email hoặc tên hiển thị, schema: { type: string, maxLength: 100 } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AdminUser' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/users/{userId}/status:
    parameters:
      - $ref: '#/components/parameters/UserId'
    put:
      tags: [Admin]
      operationId: adminSetUserStatus
      summary: Khóa hoặc mở khóa tài khoản (SYSTEM_ADMIN); khóa thu hồi mọi refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetUserStatusRequest' }
      responses:
        '204': { description: Đã cập nhật }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/plans:
    get:
      tags: [Admin]
      operationId: adminListPlans
      summary: Danh sách gói, kể cả gói không bán (SYSTEM_ADMIN)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Plan' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/plans/{planCode}:
    parameters:
      - name: planCode
        in: path
        required: true
        schema: { type: string, pattern: '^[A-Z][A-Z0-9_]{1,31}$' }
    put:
      tags: [Admin]
      operationId: adminUpsertPlan
      summary: Tạo hoặc sửa gói (SYSTEM_ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Plan' }
      responses:
        '204': { description: Đã lưu }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /admin/settings:
    get:
      tags: [Admin]
      operationId: adminListSettings
      summary: Cấu hình hệ thống (SYSTEM_ADMIN)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SystemSetting' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/settings/{key}:
    parameters:
      - name: key
        in: path
        required: true
        schema: { type: string }
    put:
      tags: [Admin]
      operationId: adminSetSetting
      summary: Sửa một cấu hình hệ thống (SYSTEM_ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value: { type: integer, minimum: 0 }
      responses:
        '204': { description: Đã lưu }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/ownership-reviews:
    get:
      tags: [Admin]
      operationId: adminListOwnershipReviews
      x-mvp: false
      summary: "[S04] Đơn khôi phục quyền trưởng tộc chờ duyệt (SYSTEM_ADMIN, SUPPORT)"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PendingReview' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/ownership-reviews/{transferId}/approve:
    parameters:
      - $ref: '#/components/parameters/TransferId'
    post:
      tags: [Admin]
      operationId: adminApproveRecovery
      x-mvp: false
      summary: "[S04] Duyệt đơn khôi phục (SYSTEM_ADMIN, SUPPORT)"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RequiredDecisionNote' }
      responses:
        '204': { description: Đã duyệt; quyền được chuyển giao }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/ownership-reviews/{transferId}/reject:
    parameters:
      - $ref: '#/components/parameters/TransferId'
    post:
      tags: [Admin]
      operationId: adminRejectRecovery
      x-mvp: false
      summary: "[S04] Từ chối đơn khôi phục (SYSTEM_ADMIN, SUPPORT)"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RequiredDecisionNote' }
      responses:
        '204': { description: Đã từ chối }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/audit-logs:
    get:
      tags: [Admin]
      operationId: adminListAuditLogs
      summary: Nhật ký thao tác quản trị (SYSTEM_ADMIN)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AdminAuditEntry' }
        '403': { $ref: '#/components/responses/Forbidden' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access token có hiệu lực 15 phút (người dùng) hoặc 30 phút (khách). Claims: `sub` (userId hoặc
        shareLinkId), `typ` (`user` hoặc `guest`); token khách có thêm `cid` (clanId). Vai trò hệ thống và
        vai trò trong dòng họ không nằm trong token mà được đọc từ cơ sở dữ liệu ở mỗi yêu cầu.
    refreshCookie:
      type: apiKey
      in: cookie
      name: gp_refresh

  parameters:
    ClanId:
      name: clanId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PersonId:
      name: personId
      in: path
      required: true
      schema: { type: string, format: uuid }
    UnionId:
      name: unionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PolicyId:
      name: policyId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ShareLinkId:
      name: shareLinkId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ClaimId:
      name: claimId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TransferId:
      name: transferId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    Size:
      name: size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    XRequestedWith:
      name: X-Requested-With
      in: header
      required: true
      schema: { type: string, const: XMLHttpRequest }
    XStepUpToken:
      name: X-Step-Up-Token
      in: header
      required: true
      description: Token nhận từ `/auth/step-up/verify`, hiệu lực 5 phút, dùng một lần
      schema: { type: string }

  responses:
    Unauthorized:
      description: Chưa xác thực hoặc token không hợp lệ
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PaymentRequired:
      description: Vượt hạn mức hoặc tính năng không thuộc gói hiện tại
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: about:blank
            title: Payment Required
            status: 402
            code: QUOTA_EXCEEDED
            detail: Gói hiện tại cho phép tối đa 300 người.
            quota: { resource: PERSONS, limit: 300 }
    Forbidden:
      description: Không có quyền thực hiện hành động trên tài nguyên
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Tài nguyên không tồn tại, thuộc dòng họ khác hoặc nằm ngoài phạm vi xem
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: about:blank
            title: Not Found
            status: 404
            code: NOT_FOUND
    Conflict:
      description: Xung đột trạng thái
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: about:blank
            title: Conflict
            status: 409
            code: VERSION_CONFLICT
            detail: Hồ sơ đã được người khác sửa. Tải lại để xem bản mới nhất.
    ValidationFailed:
      description: Dữ liệu không hợp lệ
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: about:blank
            title: Unprocessable Content
            status: 422
            code: VALIDATION_FAILED
            errors:
              - { field: birth.solar.day, code: INVALID_DATE, message: Tháng 2 năm 1990 không có ngày 30 }
    PayloadTooLarge:
      description: Tệp quá lớn
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    UnsupportedMediaType:
      description: Định dạng tệp không được hỗ trợ
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooManyRequests:
      description: Vượt giới hạn tần suất
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    # ---------- Lỗi
    ErrorCode:
      type: string
      enum:
        - VALIDATION_FAILED
        - UNAUTHENTICATED
        - INVALID_CREDENTIALS
        - EMAIL_NOT_VERIFIED
        - STEP_UP_REQUIRED
        - FORBIDDEN
        - FIELD_NOT_PERMITTED
        - NOT_FOUND
        - VERSION_CONFLICT
        - INVALID_STATE
        - EMAIL_TAKEN
        - INVALID_TOKEN
        - INVITATION_EMAIL_MISMATCH
        - ALREADY_MEMBER
        - PERSON_ALREADY_LINKED
        - OWNER_TRANSFER_REQUIRED
        - TRANSFER_IN_PROGRESS
        - ANCESTRY_CYCLE
        - DUPLICATE_BIOLOGICAL_FAMILY
        - DUPLICATE_UNION
        - HAS_RELATIONS
        - LAST_OWNER
        - POLICY_IN_USE
        - LINK_POLICY_CEILING
        - DATE_CALENDAR_MISMATCH
        - QUOTA_EXCEEDED
        - FEATURE_NOT_IN_PLAN
        - PLAN_NOT_PURCHASABLE
        - FILE_TOO_LARGE
        - UNSUPPORTED_MEDIA_TYPE
        - RATE_LIMITED
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string, default: about:blank }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { $ref: '#/components/schemas/ErrorCode' }
        quota:
          type: object
          description: Có mặt với QUOTA_EXCEEDED
          properties:
            resource: { type: string, enum: [PERSONS, MEMBERS, SHARE_LINKS, VIEW_POLICIES, STORAGE] }
            limit: { type: integer }
        errors:
          type: array
          items:
            type: object
            required: [field, code, message]
            properties:
              field: { type: string, description: 'Đường dẫn trường, ví dụ birth.lunar.day' }
              code: { type: string }
              message: { type: string }

    # ---------- Enum
    ClanRole:
      type: string
      enum: [OWNER, EDITOR, MEMBER]
    AssignableRole:
      type: string
      enum: [EDITOR, MEMBER]
    PrincipalRole:
      type: string
      enum: [OWNER, EDITOR, MEMBER, GUEST]
    SystemRole:
      type: string
      enum: [SYSTEM_ADMIN, SUPPORT]
    ClanStatus:
      type: string
      enum: [ACTIVE, SUSPENDED]
    UserStatus:
      type: string
      enum: [ACTIVE, LOCKED]
    Gender:
      type: string
      enum: [MALE, FEMALE, UNKNOWN]
    DatePrecision:
      type: string
      description: UNKNOWN hiển thị là "Chưa rõ"
      enum: [UNKNOWN, YEAR, MONTH, DAY]
    UnionStatus:
      type: string
      enum: [MARRIED, DIVORCED, WIDOWED, UNKNOWN]
    ChildRelation:
      type: string
      enum: [BIOLOGICAL, ADOPTED]
    FieldGroup:
      type: string
      description: Nhóm trường thông tin; ánh xạ trường – nhóm tại GP-DOC-03 mục 4.
      enum: [BASIC, LIFE_EVENTS, BIOGRAPHY, LIVING_BIRTH_DATE, CONTACT, ADOPTION, IDENTITY_DOCS]
    ScopeMode:
      type: string
      description: CLAN toàn bộ dòng họ; BRANCH từ người gốc cố định; RELATIVE từ hồ sơ của chính người xem.
      enum: [CLAN, BRANCH, RELATIVE]
    ClaimStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED, CANCELED]
    TransferKind:
      type: string
      enum: [VOLUNTARY, SUCCESSOR, RECOVERY]
    TransferStatus:
      type: string
      enum: [PENDING_ACCEPTANCE, PENDING_ENDORSEMENT, WAITING_PERIOD, PENDING_REVIEW, COMPLETED, CANCELED, REJECTED, EXPIRED]
    PaymentStatus:
      type: string
      enum: [PENDING, SUCCEEDED, FAILED, EXPIRED]
    AuditAction:
      type: string
      enum:
        - CLAN_CREATE
        - CLAN_UPDATE
        - CLAN_STATUS_SET_BY_ADMIN
        - PERSON_CREATE
        - PERSON_UPDATE
        - PERSON_DELETE
        - PERSON_VIEW_SENSITIVE
        - PERSON_SELF_UPDATE
        - PERSON_CLAIM_CREATE
        - PERSON_CLAIM_APPROVE
        - PERSON_CLAIM_REJECT
        - UNION_CREATE
        - UNION_UPDATE
        - UNION_DELETE
        - CHILD_ADD
        - CHILD_UPDATE
        - CHILD_REMOVE
        - VIEW_POLICY_CREATE
        - VIEW_POLICY_UPDATE
        - VIEW_POLICY_DELETE
        - MEMBER_UPDATE
        - MEMBER_REMOVE
        - INVITATION_CREATE
        - INVITATION_REVOKE
        - INVITATION_ACCEPT
        - SHARE_LINK_CREATE
        - SHARE_LINK_UPDATE
        - SHARE_LINK_REVOKE
        - SHARE_LINK_DELETE
        - GUEST_SESSION_START
        - EXPORT_PERSONS
        - SUCCESSOR_SET
        - OWNERSHIP_TRANSFER_REQUEST
        - OWNERSHIP_TAKEOVER_REQUEST
        - OWNERSHIP_RECOVERY_REQUEST
        - OWNERSHIP_RECOVERY_ENDORSE
        - OWNERSHIP_TRANSFER_COMPLETE
        - OWNERSHIP_TRANSFER_CANCEL
        - OWNERSHIP_TRANSFER_REJECT
        - PAYMENT_CREATE
        - PAYMENT_SUCCEEDED
        - PAYMENT_FAILED
        - SUBSCRIPTION_GRANT_BY_ADMIN

    # ---------- Ngày gia phả
    SolarDate:
      type: object
      description: |
        Ngày dương lịch với độ chính xác thay đổi. UNKNOWN: không có year, month, day. YEAR: chỉ có year.
        MONTH: có year và month. DAY: có đủ ba thuộc tính và phải là ngày tồn tại trên lịch.
        Trong yêu cầu, đối tượng vắng mặt được hiểu là UNKNOWN.
      required: [precision]
      properties:
        precision: { $ref: '#/components/schemas/DatePrecision' }
        year: { type: [integer, 'null'], minimum: 1, maximum: 9999 }
        month: { type: [integer, 'null'], minimum: 1, maximum: 12 }
        day: { type: [integer, 'null'], minimum: 1, maximum: 31 }
        approximate: { type: boolean, default: false, description: 'Giá trị ước lượng ("khoảng"); không áp dụng cho UNKNOWN' }
    LunarDate:
      type: object
      description: |
        Ngày âm lịch Việt Nam, áp dụng quy tắc độ chính xác như SolarDate; `day` tối đa 30;
        `leapMonth` chỉ áp dụng cho mức MONTH và DAY.
      required: [precision]
      properties:
        precision: { $ref: '#/components/schemas/DatePrecision' }
        year: { type: [integer, 'null'], minimum: 1, maximum: 9999 }
        month: { type: [integer, 'null'], minimum: 1, maximum: 12 }
        day: { type: [integer, 'null'], minimum: 1, maximum: 30 }
        leapMonth: { type: boolean, default: false }
        approximate: { type: boolean, default: false }
        canChi:
          type: string
          readOnly: true
          description: Can chi của năm âm lịch, chỉ có trong phản hồi khi năm được xác định (ví dụ "Canh Dần")
    EventDate:
      type: object
      description: |
        Một sự kiện (sinh, mất) gồm hai giá trị độc lập: dương lịch và âm lịch.
        Giao diện cung cấp nút "Tự tính" điền giá trị còn lại qua `/calendar/solar-to-lunar` hoặc
        `/calendar/lunar-to-solar`; nút chỉ được bật khi giá trị đã nhập có `precision: DAY`.
        Client không cài đặt thuật toán quy đổi.
        Backend kiểm tra sự nhất quán giữa hai giá trị: mỗi giá trị biểu diễn một khoảng ngày dương lịch
        (DAY là một ngày, MONTH là cả tháng, YEAR là cả năm; âm lịch quy đổi theo lịch Việt Nam);
        hai khoảng phải giao nhau, nếu không phản hồi 422 `DATE_CALENDAR_MISMATCH`. Khi cả hai ở mức DAY,
        hai ngày phải trùng nhau hoàn toàn, bao gồm cờ tháng nhuận. Không kiểm tra khi một giá trị là UNKNOWN
        hoặc có `approximate`. Chi tiết tại GP-DOC-02 mục 5.3.
      properties:
        solar: { $ref: '#/components/schemas/SolarDate' }
        lunar: { $ref: '#/components/schemas/LunarDate' }

    # ---------- Auth
    RegisterRequest:
      type: object
      required: [email, password, displayName]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 10, maxLength: 128, writeOnly: true }
        displayName: { type: string, minLength: 1, maxLength: 100 }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, writeOnly: true }
    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
    ResetPasswordRequest:
      type: object
      required: [token, newPassword]
      properties:
        token: { type: string, minLength: 43, maxLength: 64 }
        newPassword: { type: string, minLength: 10, maxLength: 128, writeOnly: true }
    StepUpRequest:
      type: object
      required: [password]
      properties:
        password: { type: string, writeOnly: true }
    StepUpChallenge:
      type: object
      required: [challengeId, expiresIn]
      properties:
        challengeId: { type: string, format: uuid }
        expiresIn: { type: integer, description: Giây }
    StepUpVerifyRequest:
      type: object
      required: [challengeId, code]
      properties:
        challengeId: { type: string, format: uuid }
        code: { type: string, pattern: '^[0-9]{6}$' }
    StepUpToken:
      type: object
      required: [stepUpToken, expiresIn]
      properties:
        stepUpToken: { type: string }
        expiresIn: { type: integer, description: Giây }
    TokenRequest:
      type: object
      required: [token]
      properties:
        token: { type: string, minLength: 43, maxLength: 64 }
    TokenResponse:
      type: object
      required: [accessToken, tokenType, expiresIn]
      properties:
        accessToken: { type: string }
        tokenType: { type: string, const: Bearer }
        expiresIn: { type: integer, description: Giây }
    GuestSessionResponse:
      type: object
      required: [accessToken, expiresIn, clan]
      properties:
        accessToken: { type: string }
        expiresIn: { type: integer }
        clan: { $ref: '#/components/schemas/ClanRef' }
        rootPersonId: { type: [string, 'null'], format: uuid }
    UserProfile:
      type: object
      required: [id, email, displayName, emailVerified, createdAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
        emailVerified: { type: boolean }
        systemRole:
          oneOf:
            - $ref: '#/components/schemas/SystemRole'
            - type: 'null'
        createdAt: { type: string, format: date-time }
    UserRef:
      type: object
      required: [id, displayName]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }

    # ---------- Plans & payments
    Plan:
      type: object
      required: [code, name, priceVndPerMonth, limits, features, auditRetentionDays, isPurchasable]
      properties:
        code: { type: string, pattern: '^[A-Z][A-Z0-9_]{1,31}$', example: STANDARD }
        name: { type: string, example: Tiêu chuẩn }
        priceVndPerMonth: { type: integer, minimum: 0, example: 49000 }
        limits: { $ref: '#/components/schemas/PlanLimits' }
        features: { $ref: '#/components/schemas/PlanFeatures' }
        auditRetentionDays: { type: integer, minimum: 1 }
        isPurchasable: { type: boolean }
        sortOrder: { type: integer }
    PlanLimits:
      type: object
      required: [persons, members, shareLinks, viewPolicies, storageMb]
      properties:
        persons: { type: integer }
        members: { type: integer }
        shareLinks: { type: integer }
        viewPolicies: { type: integer }
        storageMb: { type: integer }
    PlanFeatures:
      type: object
      required: [exportExcel, importExcel, kinship]
      properties:
        exportExcel: { type: boolean }
        importExcel: { type: boolean }
        kinship: { type: boolean }
    Entitlements:
      type: object
      required: [plan, limits, features, usage, auditRetentionDays]
      properties:
        plan:
          type: object
          required: [code, name]
          properties:
            code: { type: string }
            name: { type: string }
        currentPeriodEnd: { type: [string, 'null'], format: date-time, description: '`null`: không thời hạn' }
        limits: { $ref: '#/components/schemas/PlanLimits' }
        features: { $ref: '#/components/schemas/PlanFeatures' }
        auditRetentionDays: { type: integer }
        usage:
          type: object
          required: [persons, members, shareLinks, viewPolicies, storageBytes]
          properties:
            persons: { type: integer }
            members: { type: integer }
            shareLinks: { type: integer }
            viewPolicies: { type: integer }
            storageBytes: { type: integer }
    CreatePaymentRequest:
      type: object
      required: [planCode, months]
      properties:
        planCode: { type: string }
        months: { type: integer, enum: [1, 6, 12] }
    Payment:
      type: object
      required: [id, planCode, months, amountVnd, status, provider, createdAt]
      properties:
        id: { type: string, format: uuid }
        planCode: { type: string }
        months: { type: integer }
        amountVnd: { type: integer }
        status: { $ref: '#/components/schemas/PaymentStatus' }
        provider: { type: string, const: VNPAY }
        createdAt: { type: string, format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
    PaymentCreated:
      type: object
      required: [payment, paymentUrl]
      properties:
        payment: { $ref: '#/components/schemas/Payment' }
        paymentUrl: { type: string, format: uri, description: URL thanh toán VNPay đã ký; có hiệu lực 15 phút }
    VnpayIpnResponse:
      type: object
      required: [RspCode, Message]
      properties:
        RspCode: { type: string, enum: ['00', '01', '02', '04', '97', '99'] }
        Message: { type: string }

    # ---------- Clan
    ClanRef:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    ClanSummary:
      type: object
      required: [id, name, status, myRole]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        originPlace: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/ClanStatus' }
        myRole: { $ref: '#/components/schemas/ClanRole' }
    MyAccess:
      type: object
      description: Quyền hiệu lực của người xem trong dòng họ
      required: [role, scopeMode, fieldGroups]
      properties:
        role: { $ref: '#/components/schemas/PrincipalRole' }
        scopeMode: { $ref: '#/components/schemas/ScopeMode' }
        fieldGroups:
          type: array
          items: { $ref: '#/components/schemas/FieldGroup' }
        linkedPersonId: { type: [string, 'null'], format: uuid }
        isSuccessor: { type: boolean }
    Clan:
      type: object
      required: [id, name, status, myAccess, createdAt, version]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: [string, 'null'] }
        originPlace: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/ClanStatus' }
        rootPersonId: { type: [string, 'null'], format: uuid, description: Thủy tổ }
        defaultMemberPolicyId: { type: [string, 'null'], format: uuid, description: Chỉ hiển thị với OWNER }
        successorUserId: { type: [string, 'null'], format: uuid, description: Chỉ hiển thị với OWNER và EDITOR }
        myAccess: { $ref: '#/components/schemas/MyAccess' }
        createdAt: { type: string, format: date-time }
        version: { type: integer }
    CreateClanRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: [string, 'null'], maxLength: 5000 }
        originPlace: { type: [string, 'null'], maxLength: 500 }
    UpdateClanRequest:
      type: object
      required: [version]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: [string, 'null'], maxLength: 5000 }
        originPlace: { type: [string, 'null'], maxLength: 500 }
        rootPersonId: { type: [string, 'null'], format: uuid }
        defaultMemberPolicyId: { type: string, format: uuid }
        version: { type: integer }
    SetSuccessorRequest:
      type: object
      required: [userId]
      properties:
        userId: { type: [string, 'null'], format: uuid, description: '`null` để bỏ chỉ định' }

    # ---------- View policies
    ViewPolicyInput:
      type: object
      description: |
        CLAN: không có rootPersonId, depthDown, depthUp. BRANCH: bắt buộc rootPersonId, depthDown, depthUp.
        RELATIVE: không có rootPersonId; bắt buộc depthDown, depthUp; áp dụng cho thành viên đã gắn hồ sơ.
        `fieldGroups` bắt buộc chứa BASIC và không chứa IDENTITY_DOCS.
      required: [name, scopeMode, fieldGroups]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        scopeMode: { $ref: '#/components/schemas/ScopeMode' }
        rootPersonId: { type: [string, 'null'], format: uuid }
        depthDown: { type: [integer, 'null'], minimum: 0, maximum: 50 }
        depthUp: { type: [integer, 'null'], minimum: 0, maximum: 50 }
        includeSpouses: { type: boolean, default: true }
        fieldGroups:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: '#/components/schemas/FieldGroup' }
    UpdateViewPolicyRequest:
      allOf:
        - $ref: '#/components/schemas/ViewPolicyInput'
        - type: object
          required: [version]
          properties:
            version: { type: integer }
    ViewPolicy:
      allOf:
        - $ref: '#/components/schemas/ViewPolicyInput'
        - type: object
          required: [id, usage, version]
          properties:
            id: { type: string, format: uuid }
            usage:
              type: object
              required: [isClanDefault, members, shareLinks]
              properties:
                isClanDefault: { type: boolean }
                members: { type: integer, description: Số thành viên đang dùng chế độ xem này làm chế độ riêng }
                shareLinks: { type: integer, description: Số link chưa xóa đang dùng }
            linkEligible: { type: boolean, description: Có thể dùng cho link chia sẻ (không vượt trần) }
            version: { type: integer }

    # ---------- Members, claims, invitations
    Member:
      type: object
      required: [user, email, role, joinedAt, version]
      properties:
        user: { $ref: '#/components/schemas/UserRef' }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/ClanRole' }
        personId: { type: [string, 'null'], format: uuid, description: Hồ sơ gia phả gắn với tài khoản }
        viewPolicyId: { type: [string, 'null'], format: uuid, description: '`null`: dùng chế độ xem mặc định (MEMBER) hoặc toàn dòng họ (EDITOR)' }
        joinedAt: { type: string, format: date-time }
        version: { type: integer }
    UpdateMemberRequest:
      type: object
      required: [version]
      properties:
        role: { $ref: '#/components/schemas/AssignableRole' }
        personId: { type: [string, 'null'], format: uuid }
        viewPolicyId: { type: [string, 'null'], format: uuid }
        version: { type: integer }
    OwnProfileRequest:
      type: object
      required: [phone, email, currentAddress, isRestricted]
      properties:
        phone: { type: [string, 'null'], maxLength: 30 }
        email: { type: [string, 'null'], maxLength: 254 }
        currentAddress: { type: [string, 'null'], maxLength: 500 }
        isRestricted: { type: boolean }
    CreatePersonClaimRequest:
      type: object
      required: [personId]
      properties:
        personId: { type: string, format: uuid }
        note: { type: [string, 'null'], maxLength: 500 }
    PersonClaim:
      type: object
      required: [id, person, user, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        person: { $ref: '#/components/schemas/PersonRef' }
        user: { $ref: '#/components/schemas/UserRef' }
        status: { $ref: '#/components/schemas/ClaimStatus' }
        note: { type: [string, 'null'] }
        decisionNote: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        decidedAt: { type: [string, 'null'], format: date-time }
    DecisionNote:
      type: object
      properties:
        note: { type: [string, 'null'], maxLength: 2000 }
    RequiredDecisionNote:
      type: object
      required: [note]
      properties:
        note: { type: string, minLength: 1, maxLength: 2000 }
    ReasonRequest:
      type: object
      properties:
        reason: { type: [string, 'null'], maxLength: 2000 }
    TokenStatus:
      type: string
      enum: [ACTIVE, ACCEPTED, REVOKED, EXPIRED]
    Invitation:
      type: object
      required: [id, email, role, status, expiresAt, createdBy, createdAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/AssignableRole' }
        personId: { type: [string, 'null'], format: uuid }
        viewPolicyId: { type: [string, 'null'], format: uuid }
        status: { $ref: '#/components/schemas/TokenStatus' }
        expiresAt: { type: string, format: date-time }
        createdBy: { $ref: '#/components/schemas/UserRef' }
        createdAt: { type: string, format: date-time }
    CreateInvitationRequest:
      type: object
      required: [email, role]
      properties:
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/AssignableRole' }
        personId: { type: [string, 'null'], format: uuid, description: Hồ sơ được gắn khi người nhận chấp nhận }
        viewPolicyId: { type: [string, 'null'], format: uuid, description: 'Chế độ xem riêng; `null` hoặc vắng mặt: chế độ xem mặc định' }
        expiresInDays: { type: integer, minimum: 1, maximum: 14, default: 7 }
    InvitationCreated:
      type: object
      required: [invitation, token, acceptUrl]
      properties:
        invitation: { $ref: '#/components/schemas/Invitation' }
        token: { type: string, description: Chỉ trả về một lần }
        acceptUrl: { type: string, format: uri, example: 'https://giapha.example/invite#3q2-7wEj...' }

    # ---------- Ownership
    TransferRequest:
      type: object
      required: [toUserId]
      properties:
        toUserId: { type: string, format: uuid }
        reason: { type: [string, 'null'], maxLength: 2000 }
    OwnershipTransfer:
      type: object
      required: [id, kind, status, fromUser, toUser, requestedBy, createdAt]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/TransferKind' }
        status: { $ref: '#/components/schemas/TransferStatus' }
        fromUser: { $ref: '#/components/schemas/UserRef' }
        toUser: { $ref: '#/components/schemas/UserRef' }
        requestedBy: { $ref: '#/components/schemas/UserRef' }
        reason: { type: [string, 'null'] }
        expiresAt: { type: [string, 'null'], format: date-time }
        effectiveAt: { type: [string, 'null'], format: date-time, description: Thời điểm kết thúc thời gian chờ }
        endorsementCount: { type: integer }
        endorsementsRequired: { type: integer }
        createdAt: { type: string, format: date-time }
        decidedAt: { type: [string, 'null'], format: date-time }
        decisionNote: { type: [string, 'null'] }

    # ---------- Share links
    ShareLink:
      type: object
      required: [id, viewPolicyId, status, createdBy, createdAt, version]
      properties:
        id: { type: string, format: uuid }
        label: { type: [string, 'null'] }
        viewPolicyId: { type: string, format: uuid }
        status: { type: string, enum: [ACTIVE, REVOKED, EXPIRED] }
        expiresAt: { type: [string, 'null'], format: date-time, description: '`null`: không thời hạn' }
        lastUsedAt: { type: [string, 'null'], format: date-time }
        createdBy: { $ref: '#/components/schemas/UserRef' }
        createdAt: { type: string, format: date-time }
        version: { type: integer }
    CreateShareLinkRequest:
      type: object
      required: [viewPolicyId]
      properties:
        label: { type: [string, 'null'], maxLength: 200 }
        viewPolicyId: { type: string, format: uuid }
        expiresAt: { type: [string, 'null'], format: date-time, description: '`null` hoặc vắng mặt: không thời hạn' }
    UpdateShareLinkRequest:
      type: object
      required: [version]
      properties:
        label: { type: [string, 'null'], maxLength: 200 }
        viewPolicyId: { type: string, format: uuid }
        expiresAt: { type: [string, 'null'], format: date-time }
        version: { type: integer }
    ShareLinkCreated:
      type: object
      required: [shareLink, token, url]
      properties:
        shareLink: { $ref: '#/components/schemas/ShareLink' }
        token: { type: string, description: Chỉ trả về một lần }
        url: { type: string, format: uri, example: 'https://giapha.example/s#Zk3...' }

    # ---------- Person
    PersonRef:
      type: object
      required: [id, fullName, gender]
      properties:
        id: { type: string, format: uuid }
        fullName: { type: string }
        gender: { $ref: '#/components/schemas/Gender' }
    PersonSummary:
      type: object
      description: |
        Dùng cho kết quả tìm kiếm. Các thuộc tính `id`, `fullName`, `redactedFields` luôn có mặt;
        các thuộc tính khác vắng mặt khi bị ẩn theo nhóm trường.
      required: [id, fullName, redactedFields]
      properties:
        id: { type: string, format: uuid }
        fullName: { type: string }
        gender: { $ref: '#/components/schemas/Gender' }
        generation: { type: [integer, 'null'], description: 'Đời thứ mấy tính từ thủy tổ; null nếu chưa nối vào cây' }
        isLiving: { type: boolean }
        birth: { $ref: '#/components/schemas/EventDate' }
        death: { $ref: '#/components/schemas/EventDate' }
        hasPhoto: { type: boolean }
        redactedFields:
          type: array
          items: { type: string }
          description: Danh sách trường (dạng đường dẫn) bị ẩn đối với người xem hiện tại
    PersonDetail:
      allOf:
        - $ref: '#/components/schemas/PersonSummary'
        - type: object
          required: [version]
          properties:
            otherNames: { type: [string, 'null'], description: 'Tên tự, hiệu, húy' }
            isRestricted: { type: boolean, description: Chỉ hiển thị với EDITOR trở lên và chính chủ hồ sơ }
            birthPlace: { type: [string, 'null'] }
            burialPlace: { type: [string, 'null'] }
            occupation: { type: [string, 'null'] }
            biography: { type: [string, 'null'] }
            currentAddress: { type: [string, 'null'] }
            phone: { type: [string, 'null'] }
            email: { type: [string, 'null'] }
            nationalId: { type: [string, 'null'] }
            privateNote: { type: [string, 'null'] }
            relatives:
              type: object
              description: Chỉ gồm người trong phạm vi xem
              properties:
                parents:
                  type: array
                  items: { $ref: '#/components/schemas/PersonRef' }
                spouses:
                  type: array
                  items:
                    type: object
                    required: [person, unionId]
                    properties:
                      person: { $ref: '#/components/schemas/PersonRef' }
                      unionId: { type: string, format: uuid }
                      order: { type: [integer, 'null'] }
                      status: { $ref: '#/components/schemas/UnionStatus' }
                children:
                  type: array
                  items:
                    type: object
                    required: [person, unionId]
                    properties:
                      person: { $ref: '#/components/schemas/PersonRef' }
                      unionId: { type: string, format: uuid }
                      birthOrder: { type: [integer, 'null'] }
                      relation: { $ref: '#/components/schemas/ChildRelation' }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
            version: { type: integer }
    PersonFields:
      type: object
      description: Các trường ghi được, dùng chung cho thao tác tạo và sửa
      properties:
        fullName: { type: string, minLength: 1, maxLength: 200 }
        otherNames: { type: [string, 'null'], maxLength: 500 }
        gender: { $ref: '#/components/schemas/Gender' }
        isLiving: { type: boolean }
        isRestricted: { type: boolean }
        birth: { $ref: '#/components/schemas/EventDate' }
        death: { $ref: '#/components/schemas/EventDate' }
        birthPlace: { type: [string, 'null'], maxLength: 500 }
        burialPlace: { type: [string, 'null'], maxLength: 500 }
        occupation: { type: [string, 'null'], maxLength: 200 }
        biography: { type: [string, 'null'], maxLength: 20000 }
        currentAddress: { type: [string, 'null'], maxLength: 500 }
        phone: { type: [string, 'null'], maxLength: 30 }
        email: { type: [string, 'null'], maxLength: 254 }
        nationalId: { type: [string, 'null'], maxLength: 20, description: Chỉ OWNER ghi được }
        privateNote: { type: [string, 'null'], maxLength: 5000, description: Chỉ OWNER ghi được }
    CreatePersonRequest:
      allOf:
        - $ref: '#/components/schemas/PersonFields'
        - type: object
          required: [fullName]
          properties:
            link: { $ref: '#/components/schemas/PersonLink' }
    UpdatePersonRequest:
      allOf:
        - $ref: '#/components/schemas/PersonFields'
        - type: object
          required: [version]
          properties:
            version: { type: integer }
    PersonLink:
      description: Gắn người mới vào cây tại thời điểm tạo
      oneOf:
        - $ref: '#/components/schemas/LinkAsChild'
        - $ref: '#/components/schemas/LinkAsSpouse'
      discriminator:
        propertyName: type
        mapping:
          CHILD: '#/components/schemas/LinkAsChild'
          SPOUSE: '#/components/schemas/LinkAsSpouse'
    LinkAsChild:
      type: object
      required: [type, unionId]
      properties:
        type: { type: string, const: CHILD }
        unionId: { type: string, format: uuid }
        relation: { $ref: '#/components/schemas/ChildRelation' }
        birthOrder: { type: [integer, 'null'], minimum: 1 }
    LinkAsSpouse:
      type: object
      required: [type, personId]
      properties:
        type: { type: string, const: SPOUSE }
        personId: { type: string, format: uuid, description: Người đã có trong cây }
        status: { $ref: '#/components/schemas/UnionStatus' }
        order: { type: [integer, 'null'], minimum: 1, description: Đây là hôn phối thứ mấy của personId }
    PersonPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/PersonSummary' }
        page: { $ref: '#/components/schemas/PageMeta' }
    PageMeta:
      type: object
      required: [number, size, totalItems, totalPages]
      properties:
        number: { type: integer }
        size: { type: integer }
        totalItems: { type: integer }
        totalPages: { type: integer }

    # ---------- Union
    Union:
      type: object
      required: [id, status, children, version]
      properties:
        id: { type: string, format: uuid }
        partnerA:
          oneOf:
            - $ref: '#/components/schemas/PersonRef'
            - type: 'null'
        partnerB:
          oneOf:
            - $ref: '#/components/schemas/PersonRef'
            - type: 'null'
        partnerAOrder: { type: [integer, 'null'] }
        partnerBOrder: { type: [integer, 'null'] }
        status: { $ref: '#/components/schemas/UnionStatus' }
        note: { type: [string, 'null'] }
        children:
          type: array
          items: { $ref: '#/components/schemas/UnionChild' }
        version: { type: integer }
    CreateUnionRequest:
      type: object
      description: Bắt buộc có ít nhất một trong hai thuộc tính partnerAId, partnerBId; hai người phải khác nhau.
      properties:
        partnerAId: { type: [string, 'null'], format: uuid }
        partnerBId: { type: [string, 'null'], format: uuid }
        partnerAOrder: { type: [integer, 'null'], minimum: 1 }
        partnerBOrder: { type: [integer, 'null'], minimum: 1 }
        status: { $ref: '#/components/schemas/UnionStatus' }
        note: { type: [string, 'null'], maxLength: 1000 }
    UpdateUnionRequest:
      type: object
      required: [version]
      properties:
        partnerAId: { type: [string, 'null'], format: uuid }
        partnerBId: { type: [string, 'null'], format: uuid }
        partnerAOrder: { type: [integer, 'null'], minimum: 1 }
        partnerBOrder: { type: [integer, 'null'], minimum: 1 }
        status: { $ref: '#/components/schemas/UnionStatus' }
        note: { type: [string, 'null'], maxLength: 1000 }
        version: { type: integer }
    UnionChild:
      type: object
      required: [person]
      properties:
        person: { $ref: '#/components/schemas/PersonRef' }
        birthOrder: { type: [integer, 'null'] }
        relation:
          $ref: '#/components/schemas/ChildRelation'
          description: Chỉ có mặt khi người xem có nhóm trường ADOPTION
    AddChildRequest:
      type: object
      required: [childId]
      properties:
        childId: { type: string, format: uuid }
        relation: { $ref: '#/components/schemas/ChildRelation' }
        birthOrder: { type: [integer, 'null'], minimum: 1 }
    UpdateChildRequest:
      type: object
      properties:
        relation: { $ref: '#/components/schemas/ChildRelation' }
        birthOrder: { type: [integer, 'null'], minimum: 1 }

    # ---------- Tree
    TreePerson:
      type: object
      required: [id, fullName, gender]
      properties:
        id: { type: string, format: uuid }
        fullName: { type: string }
        gender: { $ref: '#/components/schemas/Gender' }
        generation: { type: [integer, 'null'] }
        isLiving: { type: boolean, description: Yêu cầu nhóm trường LIFE_EVENTS }
        lifespan:
          type: string
          description: 'Chuỗi hiển thị đã áp dụng quy tắc ẩn trường, ví dụ "1890 – 1952", "khoảng 1895 – Chưa rõ"; yêu cầu nhóm LIFE_EVENTS'
        hasPhoto: { type: boolean, description: Yêu cầu nhóm trường BIOGRAPHY }
    TreeUnion:
      type: object
      required: [id, children]
      properties:
        id: { type: string, format: uuid }
        partnerAId: { type: [string, 'null'], format: uuid }
        partnerBId: { type: [string, 'null'], format: uuid }
        partnerAOrder: { type: [integer, 'null'] }
        partnerBOrder: { type: [integer, 'null'] }
        status: { $ref: '#/components/schemas/UnionStatus' }
        children:
          type: array
          items:
            type: object
            required: [childId]
            properties:
              childId: { type: string, format: uuid }
              birthOrder: { type: [integer, 'null'] }
              relation:
                $ref: '#/components/schemas/ChildRelation'
                description: Chỉ có mặt khi người xem có nhóm trường ADOPTION
    TreeResponse:
      type: object
      required: [rootPersonId, depthDown, depthUp, truncated, persons, unions]
      properties:
        rootPersonId: { type: [string, 'null'], format: uuid }
        depthDown: { type: integer }
        depthUp: { type: integer }
        truncated: { type: boolean }
        persons:
          type: array
          items: { $ref: '#/components/schemas/TreePerson' }
        unions:
          type: array
          items: { $ref: '#/components/schemas/TreeUnion' }

    KinshipResponse:
      type: object
      required: [found]
      properties:
        found: { type: boolean }
        commonAncestor:
          oneOf:
            - $ref: '#/components/schemas/PersonRef'
            - type: 'null'
        generationsFromA: { type: [integer, 'null'] }
        generationsFromB: { type: [integer, 'null'] }
        term: { type: [string, 'null'], description: 'Cách xưng hô, ví dụ "chú họ"', example: chú họ }

    # ---------- Audit
    AuditEntry:
      type: object
      required: [id, action, createdAt]
      properties:
        id: { type: integer }
        action: { $ref: '#/components/schemas/AuditAction' }
        actorUser:
          oneOf:
            - $ref: '#/components/schemas/UserRef'
            - type: 'null'
        actorShareLinkId: { type: [string, 'null'], format: uuid }
        entityType: { type: [string, 'null'] }
        entityId: { type: [string, 'null'], format: uuid }
        detail: { type: object, additionalProperties: true }
        ip: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
    AuditPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AuditEntry' }
        page: { $ref: '#/components/schemas/PageMeta' }

    # ---------- Admin
    AdminClan:
      type: object
      required: [id, name, status, planCode, personCount, memberCount, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        status: { $ref: '#/components/schemas/ClanStatus' }
        ownerUserId: { type: [string, 'null'], format: uuid }
        ownerEmail: { type: [string, 'null'] }
        ownerLastActiveAt: { type: [string, 'null'], format: date-time }
        planCode: { type: string }
        currentPeriodEnd: { type: [string, 'null'], format: date-time }
        personCount: { type: integer }
        memberCount: { type: integer }
        createdAt: { type: string, format: date-time }
    AdminUser:
      type: object
      required: [id, email, displayName, status, emailVerified, lastActiveAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        displayName: { type: string }
        status: { $ref: '#/components/schemas/UserStatus' }
        systemRole:
          oneOf:
            - $ref: '#/components/schemas/SystemRole'
            - type: 'null'
        emailVerified: { type: boolean }
        lastActiveAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    SetClanStatusRequest:
      type: object
      required: [status, reason]
      properties:
        status: { $ref: '#/components/schemas/ClanStatus' }
        reason: { type: string, minLength: 1, maxLength: 2000 }
    SetUserStatusRequest:
      type: object
      required: [status, reason]
      properties:
        status: { $ref: '#/components/schemas/UserStatus' }
        reason: { type: string, minLength: 1, maxLength: 2000 }
    GrantSubscriptionRequest:
      type: object
      required: [planCode, reason]
      properties:
        planCode: { type: string }
        periodEnd: { type: [string, 'null'], format: date-time, description: '`null`: không thời hạn' }
        reason: { type: string, minLength: 1, maxLength: 2000 }
    SystemSetting:
      type: object
      required: [key, value, description]
      properties:
        key: { type: string, example: OWNER_INACTIVE_DAYS }
        value: { type: integer }
        description: { type: string }
    PendingReview:
      type: object
      required: [transferId, clanId, clanName, fromUserEmail, toUserEmail, requestedByEmail, endorsementCount, createdAt]
      properties:
        transferId: { type: string, format: uuid }
        clanId: { type: string, format: uuid }
        clanName: { type: string }
        fromUserEmail: { type: string }
        toUserEmail: { type: string }
        requestedByEmail: { type: string }
        reason: { type: [string, 'null'] }
        endorsementCount: { type: integer }
        createdAt: { type: string, format: date-time }
    AdminAuditEntry:
