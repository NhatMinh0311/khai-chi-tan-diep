# Môi trường phát triển cục bộ: PostgreSQL, Flyway, Redis, Mailpit.
# Khởi tạo: sao chép .env.example thành .env và đặt mật khẩu, sau đó:
#   docker compose up -d db redis mailpit
#   docker compose run --rm migrate
name: giapha

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      GP_OWNER_PASSWORD: ${GP_OWNER_PASSWORD:?set in .env}
      GP_APP_PASSWORD: ${GP_APP_PASSWORD:?set in .env}
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      # Kiểm tra qua TCP: trong giai đoạn chạy script khởi tạo, PostgreSQL chỉ lắng nghe socket nội bộ.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U gp_owner -d giapha"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    image: flyway/flyway:11-alpine
    command: migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://db:5432/giapha
      FLYWAY_USER: gp_owner
      FLYWAY_PASSWORD: ${GP_OWNER_PASSWORD:?set in .env}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
    volumes:
      - ./db/migration:/flyway/sql:ro
    depends_on:
      db:
        condition: service_healthy
    profiles: ["tools"]

  # Cache và bộ đếm giới hạn tần suất. Không lưu bền: mất dữ liệu khi khởi động lại là chấp nhận được.
  redis:
    image: redis:7.4-alpine
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?set in .env}
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
      - --appendonly
      - "no"
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 2s
      timeout: 3s
      retries: 30
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set in .env}

  # Máy chủ SMTP giả lập: nhận mọi email, xem tại http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "127.0.0.1:${SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"

volumes:
  db-data:
